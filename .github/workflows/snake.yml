name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7c3aed&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-snake-dark.svg?color_snake=#c084fc&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/github-snake.gif?color_snake=#c084fc&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # snk'nin isilti secenegi yok; SVG filtresini uretim sonrasi enjekte ediyoruz.
      # .s = yilan govdesi, rengi --cs degiskeninden gelir.
      - name: Yilana isilti ekle
        run: |
          DEFS='<defs><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>'
          for f in dist/*.svg; do
            sed -i -e "s|<style>|$DEFS|" -e 's|</style>|.s{filter:url(#glow)}</style>|' "$f"
            grep -q 'id="glow"' "$f" && echo "isilti eklendi: $f" || { echo "BASARISIZ: $f"; exit 1; }
          done

      - uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
